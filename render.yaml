databases:
  - name: needlstack-db
    plan: free
    databaseName: needlstack
    postgresMajorVersion: "16"

services:
  - type: web
    name: needlstack-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: needlstack-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://needlstack.com,http://localhost:3000
      - key: DAILY_BUDGET_USD
        value: "5.00"
    healthCheckPath: /health
